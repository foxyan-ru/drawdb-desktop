name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint (svelte-check)
        run: bun run lint

      - name: Test (bun test)
        run: bun run test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            installers: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
            installers: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            installers: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Tauri app
        run: bunx tauri build --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: drawdb-${{ matrix.name }}
          path: ${{ matrix.installers }}
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RAINMAN_TOKEN }}
          repository: rainman456/drawdb-desktop
          draft: true
          name: DrawDB Desktop ${{ github.ref_name }}
          body: 'See the assets below to download and install DrawDB Desktop.'
          files: installers/**/*
          fail_on_unmatched_files: true