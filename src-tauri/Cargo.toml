[package]
name = "drawdb-desktop"
version = "1.0.0"
description = "A lightweight desktop database diagram editor"
authors = ["drawdb"]
edition = "2021"

[lib]
name = "drawdb_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# DB client (CLAUDE.md §9). One async driver for all three engines; default
# features off to skip compile-time macros/migrations. `sqlite` bundles
# libsqlite3 (no system lib needed); rustls avoids an OpenSSL dependency.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "mysql"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
